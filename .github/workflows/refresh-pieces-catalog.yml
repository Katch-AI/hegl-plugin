name: refresh-pieces-catalog

on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # create-pull-request stages nothing and still succeeds if add-paths is stale.
      CATALOG_PATH: skills/activepieces/references/pieces-catalog.md
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Refresh catalog
        env:
          AP_PIECES_URL: https://cloud.activepieces.com/api/v1/pieces
        run: ./bin/refresh-pieces-catalog.sh
      - name: Verify the catalog landed at the expected path
        run: |
          if [ ! -f "$CATALOG_PATH" ]; then
            echo "::error::bin/refresh-pieces-catalog.sh did not write $CATALOG_PATH." \
                 "It has probably moved -- update CATALOG_PATH in this workflow to match."
            exit 1
          fi
      # An App token, unlike GITHUB_TOKEN, triggers downstream workflows (lint) on the PR.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOW_BOT_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_BOT_PRIVATE_KEY }}
      - name: Open or update PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: auto/refresh-pieces-catalog
          add-paths: ${{ env.CATALOG_PATH }}
          labels: |
            auto-approve
            automerge
          commit-message: |
            Refresh pieces-catalog.md

            Auto-generated by .github/workflows/refresh-pieces-catalog.yml
          title: Refresh pieces-catalog.md
          body: |
            Automated refresh of the Activepieces pieces catalog.

            Generated by `.github/workflows/refresh-pieces-catalog.yml`.
