name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: OpenCode plugin tests
        run: node --test .opencode/hegl.test.mjs
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Skill script tests
        run: |
          pip install pytest
          python3 -m pytest skills/*/tests -q
      - name: Manifests parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json .codex-plugin/plugin.json codex/mcp.json; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Every SKILL.md has name and description frontmatter
        run: |
          shopt -s nullglob
          status=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            head -1 "$f" | grep -qx -- '---' || { echo "$f: missing frontmatter"; status=1; }
            sed -n '2,10p' "$f" | grep -q "^name: $dir$" || { echo "$f: name must be $dir"; status=1; }
            sed -n '2,10p' "$f" | grep -q '^description: Use when' || { echo "$f: description must start with 'Use when'"; status=1; }
          done
          exit $status
      - name: No hermes-only material
        run: |
          files="skills/"; [ -f README.md ] && files="$files README.md"
          if grep -rnE 'PLATFORM_[A-Z_]+|ACTIVEPIECES_[A-Z_]+|requestActivepiecesToken|ask_user_question|set_goal|delegate_task|codingAgentSessionId|coding_agent_session_id|gql\.py|invoke_action\.py|the platform piece|\bMarcus\b' $files; then exit 1; fi
