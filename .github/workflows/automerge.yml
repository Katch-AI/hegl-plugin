name: automerge

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  # check_suite never fires for Dependabot PRs and a GITHUB_TOKEN approval fires no review
  # event, so the lint and auto-approve runs finishing are what reach those PRs.
  workflow_run:
    workflows: ["lint", "auto-approve"]
    types: [completed]

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      # An App token gets no admin bypass, so the merge API refuses until main's ruleset
      # (approval + the lint check) is satisfied; the retries below wait for that.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOW_BOT_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_BOT_PRIVATE_KEY }}
      - uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_LABELS: automerge
          MERGE_REMOVE_LABELS: automerge
          MERGE_METHOD: squash
          MERGE_COMMIT_MESSAGE: pull-request-title
          MERGE_REQUIRED_APPROVALS: 1
          MERGE_RETRIES: 10
          MERGE_RETRY_SLEEP: 30000
          UPDATE_LABELS: automerge
          UPDATE_METHOD: merge
